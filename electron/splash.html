<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 400px; height: 280px;
    background: #1E2A6E;
    border-radius: 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: white;
    overflow: hidden;
  }
  .logo { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .logo span { color: #2D7FF9; }
  .version { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 40px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #2D7FF9;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 13px; color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
  <div class="logo">Zap<span>Manager</span> Pro</div>
  <div class="version">v4.0.0</div>
  <div class="spinner"></div>
  <div class="status">Iniciando o servidor...</div>
</body>
</html>
